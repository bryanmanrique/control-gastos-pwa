<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Gastos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007AFF">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .phone { width: 100%; max-width: 400px; height: 100vh; max-height: 800px; background: #fff; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        @media (min-width: 401px) { .phone { border-radius: 30px; border: 10px solid #222; height: 90vh; } }
        header { background: #007AFF; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 18px; }
        .content { padding: 20px; flex: 1; overflow-y: auto; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #007AFF; }
        .btn { background: #007AFF; color: white; border: none; padding: 14px; border-radius: 25px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
        .btn:disabled { background: #a0c4ff; cursor: not-allowed; }
        .btn-install { background: #34C759; display: none; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(52,199,89,0.3); }
        #mensaje { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; }
        .success { color: #34C759; }
        .error { color: #FF3B30; }
    </style>
</head>
<body>
    <div class="phone">
        <header>💸 Mis Finanzas</header>
        <div class="content">
            <button id="installBtn" class="btn btn-install">📥 Instalar App en Celular</button>
            
            <form id="registroForm">
                <div class="form-group">
                    <label for="descripcionGasto">Descripción del Gasto</label>
                    <input type="text" id="descripcionGasto" placeholder="Ej. Almuerzo, Supermercado" required>
                </div>
                <div class="form-group">
                    <label for="montoGasto">Monto / Notas</label>
                    <input type="text" id="montoGasto" placeholder="Ej. S/ 45.00" required>
                </div>
                <button type="submit" id="submitBtn" class="btn">Guardar Gasto</button>
            </form>

            <p id="mensaje"></p>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        });

        // ⚠️ PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT ENTRE LAS COMILLAS ⚠️
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwnWAbaVzqZVkYqXOaXvJo7tPXNU5YFxaizFSJ1JXi4JhQM2ovESpAScyAsjlBjHc3UgQ/exec";

        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const mensaje = document.getElementById('mensaje');
            
            const payload = {
                descripcion: document.getElementById('descripcionGasto').value,
                monto: document.getElementById('montoGasto').value
            };

            submitBtn.disabled = true;
            submitBtn.innerText = "Guardando...";
            mensaje.innerText = "";

            fetch(URL_APPS_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                mensaje.innerText = "¡Gasto guardado en tu Google Sheet!";
                mensaje.className = "success";
                document.getElementById('registroForm').reset();
            })
            .catch(err => {
                mensaje.innerText = "Error al guardar.";
                mensaje.className = "error";
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Guardar Gasto";
            });
        });
    </script>
</body>
</html>
